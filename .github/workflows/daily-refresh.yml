name: Daily dashboard refresh

# 00:01 Africa/Cairo while Egypt is on UTC+2 (standard time).
# GitHub cron is UTC only, so this shifts to 01:01 Cairo during UTC+3 DST.
on:
  schedule:
    - cron: "1 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull API metrics and rebuild data.json
        env:
          OVASTA_API_BASE: ${{ secrets.OVASTA_API_BASE }}
          OVASTA_API_KEY: ${{ secrets.OVASTA_API_KEY }}
          # Temporary: the API is still plain HTTP. Remove this and rotate the key once HTTPS is on.
          OVASTA_API_ALLOW_HTTP: "1"
        run: |
          set -euo pipefail
          if [ -z "${OVASTA_API_BASE}" ] || [ -z "${OVASTA_API_KEY}" ]; then
            echo "ERROR: repository secrets OVASTA_API_BASE and OVASTA_API_KEY must be set."
            exit 1
          fi
          python scripts/api_refresh.py --out "${RUNNER_TEMP}/dashboard_dump.json"
          python scripts/build_data.py \
            --dump "${RUNNER_TEMP}/dashboard_dump.json" \
            --labels scripts/complaints_classified.json \
            --out data.json

      - name: Commit data.json if it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json
          if git diff --cached --quiet -- data.json; then
            echo "data.json unchanged; nothing to push."
          else
            git commit -m "data: $(TZ=Africa/Cairo date +%Y-%m-%d)"
            git push
          fi
